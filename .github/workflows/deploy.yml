name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install rsync and sshpass
        run: sudo apt-get install -y rsync sshpass

      - name: Sync source to server
        run: |
          sshpass -p "${{ secrets.SSH_PASS }}" rsync -avz --delete \
            --exclude='.env' \
            --exclude='service-account.json' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='.git/' \
            -e "ssh -o StrictHostKeyChecking=no" \
            . \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/notice-watch/

      - name: Build and start
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASS }}
          envs: DEEPSEEK_API_KEY,SERVICE_ACCOUNT
          script: |
            set -e
            cd ~/notice-watch

            # Write service account JSON
            printf '%s' "$SERVICE_ACCOUNT" > service-account.json

            # Write .env (only secrets; keep other vars already on server intact)
            cat > .env << EOF
            NODE_ENV=production
            PORT=3000
            FIREBASE_SERVICE_ACCOUNT_PATH=./service-account.json
            DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
            DEEPSEEK_MODEL=deepseek-chat
            DEEPSEEK_BASE_URL=https://api.deepseek.com/v1
            REDIS_URL=redis://localhost:6379
            MAX_MARKDOWN_CHARS=50000
            PLAYWRIGHT_TIMEOUT_MS=30000
            WORKER_CONCURRENCY=2
            RATE_LIMIT_MAX=100
            RATE_LIMIT_WINDOW_MS=60000
            EOF

            # Install pm2 globally if missing
            command -v pm2 > /dev/null 2>&1 || npm install -g pm2

            # Install node deps (postinstall runs: playwright install chromium)
            npm ci

            # Install chromium OS-level dependencies
            sudo npx playwright install-deps chromium

            # Build TypeScript
            npm run build

            # Start or restart via pm2
            if pm2 describe notice-watch > /dev/null 2>&1; then
              pm2 restart notice-watch
            else
              pm2 start dist/app.js --name notice-watch
            fi

            pm2 save
            pm2 startup | tail -1 | bash || true
