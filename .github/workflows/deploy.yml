name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install rsync
        run: sudo apt-get install -y rsync

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Firestore indexes
        env:
          SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT }}
        run: |
          echo "$SERVICE_ACCOUNT" > /tmp/firebase-sa.json
          npm install -g firebase-tools@13
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json firebase deploy \
            --only firestore:indexes \
            --project notice-watch \
            --non-interactive
          rm -f /tmp/firebase-sa.json

      - name: Sync source to server
        run: |
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='service-account.json' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='.git/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            . \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/notice-watch/

      - name: Build and start
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}
          PUBSUB_VERIFICATION_TOKEN: ${{ secrets.PUBSUB_VERIFICATION_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DEEPSEEK_API_KEY,SERVICE_ACCOUNT,GOOGLE_PLAY_SERVICE_ACCOUNT_KEY,PUBSUB_VERIFICATION_TOKEN
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd ~/notice-watch

            # Write service account JSON
            printf '%s' "$SERVICE_ACCOUNT" > service-account.json

            # Write .env
            cat > .env << EOF
            NODE_ENV=production
            PORT=5674
            FIREBASE_SERVICE_ACCOUNT_PATH=./service-account.json
            DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
            DEEPSEEK_MODEL=deepseek-chat
            DEEPSEEK_BASE_URL=https://api.deepseek.com/v1
            REDIS_URL=redis://localhost:6379
            MAX_MARKDOWN_CHARS=50000
            PLAYWRIGHT_TIMEOUT_MS=30000
            WORKER_CONCURRENCY=2
            RATE_LIMIT_MAX=100
            RATE_LIMIT_WINDOW_MS=60000
            GOOGLE_PLAY_PACKAGE_NAME=com.iishanto.noticewatch
            GOOGLE_PLAY_SERVICE_ACCOUNT_KEY=${GOOGLE_PLAY_SERVICE_ACCOUNT_KEY}
            PUBSUB_VERIFICATION_TOKEN=${PUBSUB_VERIFICATION_TOKEN}
            EOF

            # Install pm2 globally if missing
            command -v pm2 > /dev/null 2>&1 || npm install -g pm2

            # Install node deps (skip postinstall — playwright install runs separately)
            npm install --ignore-scripts

            # Install chromium — skip OS validation (ubuntu26.04 not yet in playwright's allowlist)
            PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS=1 ./node_modules/.bin/playwright install chromium

            # Build TypeScript
            npm run build

            # Start or restart via pm2
            if pm2 describe notice-watch > /dev/null 2>&1; then
              pm2 reload notice-watch
            else
              pm2 start dist/app.js --name notice-watch
            fi

            # Persist process list across reboots
            pm2 save

            # Setup startup script (needs sudo once on server — skip error if already done)
            env PATH=$PATH:$(dirname $(which node)) pm2 startup systemd -u $USER --hp $HOME 2>/dev/null | tail -1 | sudo bash || true
