<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notice Tracker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Ant Design reset -->
  <link rel="stylesheet" href="https://unpkg.com/antd@5.21.6/dist/reset.css" />

  <!-- dayjs — MUST load before antd (antd UMD depends on it as a global) -->
  <script src="https://unpkg.com/dayjs@1.11.11/dayjs.min.js"></script>

  <!-- React 18 -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- Ant Design 5 (requires dayjs + React globals to already be defined) -->
  <script src="https://unpkg.com/antd@5.21.6/dist/antd.min.js"></script>

  <!-- Babel (JSX at runtime — must come after all UMD libs) -->
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f7fa;
    }

    /* ── Marquee ticker ──────────────────────────────────────────────────────── */
    .ticker-bar {
      background: linear-gradient(90deg, #e6f4ff 0%, #f0f7ff 100%);
      border-bottom: 1px solid #bae0ff;
      height: 36px;
      display: flex;
      align-items: center;
      overflow: hidden;
    }
    .ticker-pill {
      background: #1677ff;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 3px 12px 3px 10px;
      border-radius: 0 14px 14px 0;
      white-space: nowrap;
      flex-shrink: 0;
      z-index: 1;
      margin-right: 8px;
      user-select: none;
    }
    .ticker-track {
      flex: 1;
      overflow: hidden;
      mask-image: linear-gradient(to right, transparent 0%, black 4%, black 96%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 4%, black 96%, transparent 100%);
    }
    .ticker-inner {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      animation: ticker-scroll 28s linear infinite;
    }
    .ticker-inner:hover { animation-play-state: paused; cursor: default; }
    @keyframes ticker-scroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .ticker-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-right: 48px;
      font-size: 12.5px;
      color: #0958d9;
      font-weight: 500;
    }
    .ticker-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #1677ff;
      border-radius: 50%;
      flex-shrink: 0;
      animation: pulse-ticker 2s ease-in-out infinite;
    }
    @keyframes pulse-ticker {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }
    .ticker-date {
      font-size: 11px;
      color: #8c8c8c;
      font-weight: 400;
    }
    .ticker-sep {
      color: #91caff;
      margin-right: 48px;
    }

    /* ── App shell ───────────────────────────────────────────────────────────── */
    .app-header {
      background: #fff;
      border-bottom: 1px solid #f0f0f0;
      box-shadow: 0 1px 3px rgba(0, 21, 41, 0.06);
      position: sticky;
      top: 0;
      z-index: 100;
      height: 58px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 700;
      color: #141414;
      user-select: none;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #1677ff, #4096ff);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .app-content {
      max-width: 1080px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    /* ── API status bar ──────────────────────────────────────────────────────── */
    .api-bar {
      background: #fff;
      border: 1px solid #f0f0f0;
      border-radius: 8px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .api-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d9d9d9;
      flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .api-dot.ok  {
      background: #52c41a;
      box-shadow: 0 0 0 3px rgba(82, 196, 26, 0.15);
    }
    .api-dot.err { background: #ff4d4f; }

    /* ── Notice cards ────────────────────────────────────────────────────────── */
    .notice-unread {
      border-left: 3px solid #1677ff !important;
    }
    .notice-read {
      border-left: 3px solid #d9d9d9 !important;
      opacity: 0.72;
    }

    /* ── Section label ───────────────────────────────────────────────────────── */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8c8c8c;
      margin-bottom: 10px;
    }

    /* ── Login page ──────────────────────────────────────────────────────────── */
    .login-bg {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f0f7ff 0%, #f5f7fa 60%, #fff7e6 100%);
    }
  </style>
</head>
<body>

<div id="root">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh">
    <div style="font-family:sans-serif;color:#8c8c8c;font-size:14px">Loading…</div>
  </div>
</div>

<!-- ── Firebase ESM (deferred — runs after HTML is parsed) ─────────────────── -->

<!-- ── React App ─────────────────────────────────────────────────────────────── -->
<script type="text/babel">
  const { useState, useEffect, useRef, useCallback, useMemo } = React;
  const {
    ConfigProvider, Card, Button, Input, Form, Tag, Badge,
    Space, Typography, Spin, Avatar, Tooltip, Empty,
    Tabs, Alert, Collapse, Divider, message,
  } = antd;
  const { Text, Title, Link } = Typography;

  // ── API ──────────────────────────────────────────────────────────────────────

  async function apiFetch(base, path, opts = {}) {
    const token   = await window._fb?.getToken?.();
    const url     = (base || '').replace(/\/$/, '') + path;
    const hasBody = opts.body != null;
    const res     = await fetch(url, {
      ...opts,
      headers: {
        ...(hasBody ? { 'Content-Type': 'application/json' } : {}),
        ...(token ? { Authorization: `Bearer ${token}` } : {}),
        ...(opts.headers ?? {}),
      },
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.message ?? `HTTP ${res.status}`);
    }
    return res.status === 204 ? null : res.json();
  }

  function relTime(seconds) {
    if (!seconds) return '—';
    const d = Math.floor(Date.now() / 1000) - seconds;
    if (d < 60)    return 'Just now';
    if (d < 3600)  return `${Math.floor(d / 60)}m ago`;
    if (d < 86400) return `${Math.floor(d / 3600)}h ago`;
    return `${Math.floor(d / 86400)}d ago`;
  }

  function isUnread(n) { return !n.readAt; }

  // ── Marquee Ticker ───────────────────────────────────────────────────────────

  function UnreadTicker({ notices }) {
    if (!notices.length) return null;
    // Double the items for a seamless CSS loop (animate -50% of total width)
    const doubled = [...notices, ...notices];
    return (
      <div className="ticker-bar">
        <div className="ticker-pill">🔔 UNREAD</div>
        <div className="ticker-track">
          <div className="ticker-inner">
            {doubled.map((n, i) => (
              <span key={`${n.id}-${i}`} className="ticker-item">
                <span className="ticker-dot" />
                {n.title}
                {n.publishedDate && (
                  <span className="ticker-date">({n.publishedDate})</span>
                )}
                <span className="ticker-sep">·</span>
              </span>
            ))}
          </div>
        </div>
      </div>
    );
  }

  // ── Notice Item ──────────────────────────────────────────────────────────────

  function NoticeItem({ notice, onMarkRead }) {
    const [busy, setBusy] = useState(false);
    const read = !isUnread(notice);

    async function handleMark(e) {
      e.stopPropagation();
      setBusy(true);
      try { await onMarkRead(notice.id); }
      finally { setBusy(false); }
    }

    return (
      <Card
        size="small"
        className={read ? 'notice-read' : 'notice-unread'}
        style={{ marginBottom: 8, borderRadius: 8 }}
        bodyStyle={{ padding: '12px 16px' }}
      >
        <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
          <div style={{ flex: 1, minWidth: 0 }}>

            {/* Title row */}
            <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 8, marginBottom: 5 }}>
              <Space align="center" size={6} style={{ flexWrap: 'wrap', flex: 1 }}>
                <Badge color={read ? '#d9d9d9' : '#1677ff'} />
                <Text
                  strong
                  style={{ fontSize: 13.5, color: read ? '#8c8c8c' : '#141414', lineHeight: 1.4 }}
                >
                  {notice.title}
                </Text>
                {!read && (
                  <Tag
                    color="blue"
                    style={{ fontSize: 10, padding: '0 5px', lineHeight: '17px', borderRadius: 4 }}
                  >
                    UNREAD
                  </Tag>
                )}
              </Space>
              {!read ? (
                <Button
                  type="link"
                  size="small"
                  loading={busy}
                  onClick={handleMark}
                  style={{ fontSize: 12, padding: 0, height: 'auto', flexShrink: 0, color: '#52c41a' }}
                >
                  ✓ Mark as read
                </Button>
              ) : (
                <Tag style={{ fontSize: 10, flexShrink: 0 }}>Read</Tag>
              )}
            </div>

            {/* Summary */}
            <Text
              style={{ fontSize: 12, color: '#595959', lineHeight: 1.65, display: 'block', marginBottom: 7 }}
            >
              {notice.summary}
            </Text>

            {/* Footer */}
            <Space size={16} wrap>
              {notice.publishedDate && (
                <Text type="secondary" style={{ fontSize: 11 }}>
                  📅 {notice.publishedDate}
                </Text>
              )}
              {notice.link && (
                <a
                  href={notice.link}
                  target="_blank"
                  rel="noopener noreferrer"
                  style={{ fontSize: 11, color: '#1677ff' }}
                >
                  🔗 View notice
                </a>
              )}
            </Space>
          </div>
        </div>
      </Card>
    );
  }

  // ── Tracker Card ─────────────────────────────────────────────────────────────

  const STATUS_COLOR = { idle: '#8c8c8c', running: '#fa8c16', done: '#52c41a', error: '#ff4d4f' };
  const STATUS_LABEL = { idle: 'Idle', running: 'Scraping…', done: 'Up to date', error: 'Error' };

  function TrackerCard({ tracker, apiBase, onDelete, onToggle, onNoticesUpdated, msgApi }) {
    const [open, setOpen]           = useState(false);
    const [notices, setNotices]     = useState(null);
    const [loading, setLoading]     = useState(false);

    async function fetchNotices() {
      setLoading(true);
      try {
        const data = await apiFetch(apiBase, `/api/notices/${tracker.id}`);
        const list = data.notices ?? [];
        setNotices(list);
        onNoticesUpdated(tracker.id, list);
      } catch (e) {
        msgApi.error(`Failed to load notices: ${e.message}`);
      } finally {
        setLoading(false);
      }
    }

    function toggleOpen() {
      const next = !open;
      setOpen(next);
      if (next && notices === null) fetchNotices();
    }

    async function markRead(noticeId) {
      try {
        await apiFetch(apiBase, `/api/notices/${noticeId}/read`, { method: 'PATCH' });
        const updated = notices.map(n => n.id === noticeId ? { ...n, readAt: true } : n);
        setNotices(updated);
        onNoticesUpdated(tracker.id, updated);
        msgApi.success('Marked as read');
      } catch (e) {
        msgApi.error(e.message);
      }
    }

    const unread = notices ? notices.filter(isUnread).length : null;
    const color  = STATUS_COLOR[tracker.status] ?? '#8c8c8c';
    const label  = STATUS_LABEL[tracker.status] ?? tracker.status;

    return (
      <Card
        style={{ marginBottom: 12, borderRadius: 10, overflow: 'hidden' }}
        bodyStyle={{ padding: 0 }}
        styles={{ body: { padding: 0 } }}
      >
        {/* ── Header (click to expand) ── */}
        <div
          onClick={toggleOpen}
          style={{
            padding: '14px 18px',
            cursor: 'pointer',
            display: 'flex',
            alignItems: 'center',
            gap: 12,
            background: '#fff',
          }}
        >
          <Badge color={color} title={label} />

          <div style={{ flex: 1, minWidth: 0 }}>
            <Text
              strong
              style={{ display: 'block', fontSize: 13.5, color: '#141414', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}
              title={tracker.url}
            >
              {tracker.url}
            </Text>
            <Space size={6} style={{ marginTop: 3, flexWrap: 'wrap' }}>
              <Tag color="geekblue" style={{ fontSize: 11, maxWidth: 260, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                {tracker.prompt}
              </Tag>
              <Text type="secondary" style={{ fontSize: 11, fontFamily: 'monospace' }}>
                {tracker.lastCheckedAt
                  ? `⏱ ${relTime(tracker.lastCheckedAt._seconds)}`
                  : 'Never checked'}
              </Text>
            </Space>
          </div>

          {/* ── Actions (stop propagation so click doesn't expand) ── */}
          <Space
            size={6}
            onClick={e => e.stopPropagation()}
            style={{ flexShrink: 0 }}
          >
            <Tag
              color={tracker.status === 'done' ? 'success' : tracker.status === 'error' ? 'error' : tracker.status === 'running' ? 'warning' : 'default'}
              style={{ fontSize: 11 }}
            >
              {label}
            </Tag>
            {unread !== null && unread > 0 && (
              <Badge count={unread} size="small" color="#1677ff" />
            )}
            <Tooltip title={tracker.active ? 'Pause' : 'Resume'}>
              <Button
                type="text"
                size="small"
                style={{ padding: '0 6px' }}
                onClick={() => onToggle(tracker.id)}
              >
                {tracker.active ? '⏸' : '▶️'}
              </Button>
            </Tooltip>
            <Button type="text" size="small" danger onClick={() => onDelete(tracker.id)}>
              Delete
            </Button>
          </Space>

          <Text type="secondary" style={{ fontSize: 12, flexShrink: 0, marginLeft: 4 }}>
            {open ? '▲' : '▽'}
          </Text>
        </div>

        {/* ── Notices panel ── */}
        {open && (
          <div style={{ borderTop: '1px solid #f5f5f5', padding: '0 18px 18px', background: '#fafafa' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '12px 0 10px' }}>
              <Space size={8}>
                <Text type="secondary" style={{ fontSize: 13 }}>Notices</Text>
                {unread !== null && unread > 0 && (
                  <Tag color="blue" style={{ fontSize: 11 }}>{unread} unread</Tag>
                )}
                {unread === 0 && notices !== null && (
                  <Tag color="default" style={{ fontSize: 11 }}>All read</Tag>
                )}
              </Space>
              <Button size="small" onClick={fetchNotices} loading={loading}>
                ↻ Refresh
              </Button>
            </div>

            {loading && (
              <div style={{ textAlign: 'center', padding: 24 }}>
                <Spin size="small" />
                <Text type="secondary" style={{ display: 'block', marginTop: 8, fontSize: 12 }}>
                  Loading notices…
                </Text>
              </div>
            )}

            {!loading && notices !== null && notices.length === 0 && (
              <Empty
                image={Empty.PRESENTED_IMAGE_SIMPLE}
                description={<Text type="secondary" style={{ fontSize: 12 }}>No notices yet. Scraper will check on the next cycle.</Text>}
                style={{ paddingTop: 12, paddingBottom: 4 }}
              />
            )}

            {!loading && notices !== null && notices.length > 0 &&
              notices.map(n => (
                <NoticeItem key={n.id} notice={n} onMarkRead={markRead} />
              ))
            }
          </div>
        )}
      </Card>
    );
  }

  // ── Login Page ───────────────────────────────────────────────────────────────

  function LoginPage() {
    const [tab, setTab]       = useState('login');
    const [email, setEmail]   = useState('');
    const [pass, setPass]     = useState('');
    const [busy, setBusy]     = useState(false);
    const [err, setErr]       = useState('');

    const tabItems = [
      { key: 'login',  label: 'Sign In'  },
      { key: 'signup', label: 'Sign Up'  },
    ];

    async function submit() {
      if (!email || !pass) return;
      setErr(''); setBusy(true);
      try {
        if (tab === 'login') await window._fb.signIn(email, pass);
        else                  await window._fb.signUp(email, pass);
      } catch (e) {
        const c = e?.code ?? '';
        if (c.includes('invalid-email'))   setErr('Invalid email address.');
        else if (c.includes('user-not-found')) setErr('No account with that email.');
        else if (c.includes('wrong-password')) setErr('Incorrect password.');
        else if (c.includes('email-already'))  setErr('Email already in use.');
        else if (c.includes('weak-password'))  setErr('Password must be at least 6 characters.');
        else setErr(e?.message ?? 'Unknown error.');
      } finally { setBusy(false); }
    }

    return (
      <div className="login-bg">
        <Card
          style={{ width: 420, borderRadius: 16, boxShadow: '0 8px 32px rgba(0,0,0,0.08)' }}
          bodyStyle={{ padding: '32px 36px' }}
        >
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 24 }}>
            <div className="brand-icon">📡</div>
            <div>
              <Text strong style={{ fontSize: 17, display: 'block', lineHeight: 1.3 }}>Notice Tracker</Text>
              <Text type="secondary" style={{ fontSize: 12 }}>Web Console</Text>
            </div>
          </div>

          <Tabs activeKey={tab} onChange={k => { setTab(k); setErr(''); }} items={tabItems} style={{ marginBottom: 18 }} />

          <Form layout="vertical" onFinish={submit}>
            <Form.Item label="Email" style={{ marginBottom: 14 }}>
              <Input
                type="email"
                size="large"
                placeholder="you@example.com"
                value={email}
                onChange={e => setEmail(e.target.value)}
                autoFocus
              />
            </Form.Item>
            <Form.Item label="Password" style={{ marginBottom: 18 }}>
              <Input.Password
                size="large"
                placeholder={tab === 'signup' ? 'Min 6 characters' : '••••••••'}
                value={pass}
                onChange={e => setPass(e.target.value)}
                onPressEnter={submit}
              />
            </Form.Item>

            {err && (
              <Alert message={err} type="error" showIcon style={{ marginBottom: 14, borderRadius: 8 }} />
            )}

            <Button type="primary" size="large" block loading={busy} onClick={submit}>
              {tab === 'login' ? 'Sign In' : 'Create Account'}
            </Button>
          </Form>
        </Card>
      </div>
    );
  }

  // ── Main App ─────────────────────────────────────────────────────────────────

  function MainApp({ user }) {
    const [msgApi, ctxHolder]         = message.useMessage();
    const [apiBase, setApiBase]       = useState('');
    const [apiStatus, setApiStatus]   = useState(null); // null | 'ok' | 'err'
    const [apiMs, setApiMs]           = useState(null);
    const [trackers, setTrackers]     = useState([]);
    const [loading, setLoading]       = useState(true);
    const [addUrl, setAddUrl]         = useState('');
    const [addPrompt, setAddPrompt]   = useState('');
    const [adding, setAdding]         = useState(false);
    const [noticeMap, setNoticeMap]   = useState({}); // { trackerId: Notice[] }
    const pollerRef                   = useRef(null);

    // All unread notices from all expanded tracker panels
    const allUnread = useMemo(
      () => Object.values(noticeMap).flat().filter(isUnread),
      [noticeMap]
    );

    const api = useCallback(
      (path, opts) => apiFetch(apiBase, path, opts),
      [apiBase]
    );

    async function pingApi(base) {
      const b = (base ?? apiBase);
      setApiStatus(null);
      try {
        const t0 = Date.now();
        await fetch((b || '').replace(/\/$/, '') + '/health');
        setApiMs(Date.now() - t0);
        setApiStatus('ok');
      } catch {
        setApiStatus('err');
        setApiMs(null);
      }
    }

    async function loadTrackers() {
      setLoading(true);
      try {
        const data = await api('/api/trackers');
        setTrackers((data.trackers ?? []).map(t => ({
          ...t,
          status: t.lastCheckedAt ? 'done' : 'idle',
        })));
      } catch (e) {
        msgApi.error(`Could not load trackers: ${e.message}`);
      } finally {
        setLoading(false);
      }
    }

    async function addTracker() {
      const url    = addUrl.trim();
      const prompt = addPrompt.trim();
      if (!url || !prompt) { msgApi.warning('Enter both URL and prompt'); return; }
      setAdding(true);
      try {
        await api('/api/trackers', {
          method: 'POST',
          body: JSON.stringify({ url, prompt }),
        });
        setAddUrl(''); setAddPrompt('');
        msgApi.success('Tracker created — scrape queued!');
        await loadTrackers();
      } catch (e) { msgApi.error(e.message); }
      finally { setAdding(false); }
    }

    async function deleteTracker(id) {
      try {
        await api(`/api/trackers/${id}`, { method: 'DELETE' });
        setTrackers(prev => prev.filter(t => t.id !== id));
        setNoticeMap(prev => { const n = { ...prev }; delete n[id]; return n; });
        msgApi.info('Tracker removed');
      } catch (e) { msgApi.error(e.message); }
    }

    async function toggleTracker(id) {
      try {
        const res = await api(`/api/trackers/${id}`, { method: 'PATCH' });
        setTrackers(prev => prev.map(t => t.id === id ? { ...t, active: res.active } : t));
      } catch (e) { msgApi.error(e.message); }
    }

    function handleNoticesUpdated(trackerId, notices) {
      setNoticeMap(prev => ({ ...prev, [trackerId]: notices }));
    }

    // Poll for scraper status changes every 8s
    useEffect(() => {
      pollerRef.current = setInterval(async () => {
        try {
          const data = await api('/api/trackers');
          setTrackers(prev => {
            let changed = false;
            const next = prev.map(local => {
              const fresh = (data.trackers ?? []).find(t => t.id === local.id);
              if (!fresh) return local;
              const freshTs = fresh.lastCheckedAt?._seconds ?? 0;
              const localTs = local.lastCheckedAt?._seconds ?? 0;
              if (freshTs > localTs) { changed = true; return { ...local, ...fresh, status: 'done' }; }
              return local;
            });
            return changed ? next : prev;
          });
        } catch { /* silent */ }
      }, 8000);
      return () => clearInterval(pollerRef.current);
    }, [api]);

    useEffect(() => {
      loadTrackers();
      pingApi();
    }, []);

    return (
      <div style={{ minHeight: '100vh', background: '#f5f7fa' }}>
        {ctxHolder}

        {/* Header */}
        <div className="app-header">
          <div className="brand">
            <div className="brand-icon">📡</div>
            Notice Tracker
          </div>
          <Space size={10}>
            <Avatar style={{ background: '#1677ff', fontSize: 13, width: 28, height: 28, lineHeight: '28px' }}>
              {(user.email?.[0] ?? '?').toUpperCase()}
            </Avatar>
            <Text type="secondary" style={{ fontSize: 13 }}>{user.email}</Text>
            <Button size="small" onClick={() => window._fb.signOut()}>Sign out</Button>
          </Space>
        </div>

        {/* Unread ticker */}
        <UnreadTicker notices={allUnread} />

        {/* Content */}
        <div className="app-content">

          {/* API status */}
          <div className="api-bar">
            <div className={`api-dot${apiStatus === 'ok' ? ' ok' : apiStatus === 'err' ? ' err' : ''}`} />
            <Text type="secondary" style={{ fontSize: 12, whiteSpace: 'nowrap' }}>API</Text>
            <Input
              value={apiBase}
              onChange={e => setApiBase(e.target.value)}
              placeholder="(same origin)"
              bordered={false}
              style={{ flex: 1, fontSize: 12.5, fontFamily: 'monospace', padding: '0 4px' }}
              onBlur={() => pingApi()}
              onPressEnter={() => pingApi()}
            />
            <Button size="small" onClick={() => pingApi()}>Ping</Button>
            <Text type="secondary" style={{ fontSize: 12, whiteSpace: 'nowrap' }}>
              {apiStatus === 'ok' ? `Online · ${apiMs}ms` : apiStatus === 'err' ? 'Offline' : '—'}
            </Text>
          </div>

          {/* Add Tracker */}
          <Card style={{ marginBottom: 24, borderRadius: 10 }} bodyStyle={{ padding: '18px 20px' }}>
            <Text strong style={{ fontSize: 14, display: 'block', marginBottom: 14 }}>➕ Add Tracker</Text>
            <Space.Compact style={{ width: '100%' }} size="middle">
              <Input
                placeholder="https://university.edu/notices"
                value={addUrl}
                onChange={e => setAddUrl(e.target.value)}
                style={{ flex: 2 }}
              />
              <Input
                placeholder="e.g. Track scholarship notices only"
                value={addPrompt}
                onChange={e => setAddPrompt(e.target.value)}
                onPressEnter={addTracker}
                style={{ flex: 2 }}
              />
              <Button type="primary" loading={adding} onClick={addTracker}>
                Track
              </Button>
            </Space.Compact>
          </Card>

          {/* Tracker list */}
          <div className="section-label">Your Trackers</div>

          {loading ? (
            <div style={{ textAlign: 'center', padding: 48 }}>
              <Spin />
              <Text type="secondary" style={{ display: 'block', marginTop: 12, fontSize: 13 }}>
                Loading trackers…
              </Text>
            </div>
          ) : trackers.length === 0 ? (
            <Card style={{ borderRadius: 10 }} bodyStyle={{ padding: '40px 24px' }}>
              <Empty
                description={
                  <Space direction="vertical" size={2}>
                    <Text type="secondary">No trackers yet</Text>
                    <Text type="secondary" style={{ fontSize: 12 }}>
                      Add a URL above to start monitoring notices.
                    </Text>
                  </Space>
                }
              />
            </Card>
          ) : (
            trackers.map(t => (
              <TrackerCard
                key={t.id}
                tracker={t}
                apiBase={apiBase}
                onDelete={deleteTracker}
                onToggle={toggleTracker}
                onNoticesUpdated={handleNoticesUpdated}
                msgApi={msgApi}
              />
            ))
          )}
        </div>
      </div>
    );
  }

  // ── Root ─────────────────────────────────────────────────────────────────────

  function App() {
    const [fbReady, setFbReady] = useState(!!window._fb);
    const [user, setUser]       = useState(undefined); // undefined = loading

    useEffect(() => {
      if (fbReady) return;
      const h = () => setFbReady(true);
      document.addEventListener('firebase-ready', h);
      return () => document.removeEventListener('firebase-ready', h);
    }, [fbReady]);

    useEffect(() => {
      if (!fbReady) return;
      return window._fb.onAuthStateChanged(u => setUser(u ?? null));
    }, [fbReady]);

    if (!fbReady || user === undefined) {
      return (
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh' }}>
          <Spin size="large" />
        </div>
      );
    }

    return user ? <MainApp user={user} /> : <LoginPage />;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(
    <ConfigProvider
      theme={{
        token: {
          colorPrimary: '#1677ff',
          borderRadius: 8,
          fontFamily: "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
        },
      }}
    >
      <App />
    </ConfigProvider>
  );
</script>

</body>
</html>
